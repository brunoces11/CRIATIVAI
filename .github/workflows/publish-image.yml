name: Build and publish CriativAI image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: criativai-image-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_REPOSITORY: ${{ vars.DOCKERHUB_USERNAME }}/criativai
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.deploy
          platforms: linux/amd64
          load: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:sha-${{ github.sha }}
            ${{ env.IMAGE_REPOSITORY }}:latest

      - name: Verify image in an isolated container
        run: |
          docker run --rm -i --network none \
            -e APP_ENV=development \
            -e DATABASE_URL=sqlite:////tmp/criativai-image-check.db \
            --entrypoint python "$IMAGE_REPOSITORY:sha-$GITHUB_SHA" - \
            < scripts/verify-deploy-image.py

      - name: Publish verified image
        run: |
          remote_head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "main changed during the build; the newer commit must be published instead." >&2
            exit 1
          fi
          docker push "$IMAGE_REPOSITORY:sha-$GITHUB_SHA"
          docker push "$IMAGE_REPOSITORY:latest"
          echo "Image: $IMAGE_REPOSITORY:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
